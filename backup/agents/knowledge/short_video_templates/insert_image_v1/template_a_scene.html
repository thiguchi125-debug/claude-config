<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; }
  body { font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    width:1080px; height:1920px; position:relative; overflow:hidden; background:#f3efe4; }
  .stage { position:absolute; inset:0; }
  svg.scene { position:absolute; inset:0; width:1080px; height:1920px; z-index:10; }

  .headline { position:absolute; top:48px; left:46px; width:988px; text-align:center; z-index:40;
    background:linear-gradient(180deg, rgba(247,243,234,.94) 0%, rgba(238,246,226,.92) 100%);
    border-radius:30px; padding:34px 36px 50px; box-shadow:0 14px 34px rgba(31,90,58,.26); }
  .headline .lead { display:inline-block; font-size:58px; font-weight:900; letter-spacing:.06em;
    color:#143a26; background:#c7ff4a; padding:16px 44px; border-radius:10px;
    box-shadow:0 8px 20px rgba(31,90,58,.28); white-space:nowrap; }
  .headline .main { margin-top:42px; font-size:118px; font-weight:900; line-height:1.42; color:#15402a;
    letter-spacing:.01em; text-shadow:0 2px 3px rgba(255,255,255,.7); }
  .headline .main .lime { color:#2f8a4f;
    -webkit-text-stroke:4px #0f3d27; paint-order:stroke fill;
    text-shadow:0 2px 3px rgba(255,255,255,.5); }
</style>
</head>
