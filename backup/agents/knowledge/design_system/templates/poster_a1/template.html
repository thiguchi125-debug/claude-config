<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>草川たくや A1ポスタースターター</title>
  <style>
    @page { size: 600mm 847mm; margin: 0; }
    * { box-sizing: border-box; }
    html, body { width: 600mm; height: 847mm; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #0f3d27;
      color: #0f3d27;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      position: relative;
      width: 600mm;
      height: 847mm;
      overflow: hidden;
      background: #f3efe4;
    }
    .sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .24;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(15,61,39,.18) .45mm, transparent .5mm);
      background-size: 6mm 6mm;
    }
    .trim {
      position: absolute;
      left: 3mm;
      top: 3mm;
      width: 594mm;
      height: 841mm;
      overflow: hidden;
    }
    .masthead {
      position: absolute;
      left: 28mm;
      top: 22mm;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 9mm;
      font-family: Arial, sans-serif;
      font-size: 6.5mm;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .masthead::before { content: ""; width: 44mm; height: 3.2mm; background: #c7ff4a; }
    .edition {
      position: absolute;
      right: 27mm;
      top: 22mm;
      z-index: 4;
      padding: 4mm 7mm 3.5mm;
      color: #f3efe4;
      background: #0f3d27;
      font: 800 5.8mm/1 Arial, sans-serif;
      letter-spacing: .08em;
    }
    .headline {
      position: absolute;
      left: 27mm;
      top: 78mm;
      z-index: 6;
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 45mm;
      font-weight: 900;
      line-height: .99;
      letter-spacing: -.055em;
    }
    .headline span { box-shadow: inset 0 -8mm 0 #c7ff4a; }
    .lead {
      position: absolute;
      left: 31mm;
      top: 281mm;
      z-index: 6;
      width: 250mm;
      margin: 0;
      font-size: 9.5mm;
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: .02em;
    }
    .photo {
      position: absolute;
      right: -19mm;
      top: 236mm;
      z-index: 3;
      width: 344mm;
      height: 420mm;
      overflow: hidden;
      transform: rotate(-3.2deg);
      border: 4mm solid #0f3d27;
      background:
        linear-gradient(143deg, transparent 0 48%, rgba(199,255,74,.88) 48% 52%, transparent 52%),
        linear-gradient(155deg, #d8ded7, #809889);
      box-shadow: 10mm 12mm 0 #c7ff4a;
    }
    .photo::after {
      content: "PORTRAIT / PHOTO";
      position: absolute;
      left: 18mm;
      bottom: 18mm;
      color: #f3efe4;
      font: 900 8mm/1 Arial, sans-serif;
      letter-spacing: .15em;
    }
    .vertical-note {
      position: absolute;
      right: 24mm;
      top: 102mm;
      z-index: 7;
      writing-mode: vertical-rl;
      font-size: 6.3mm;
      font-weight: 800;
      letter-spacing: .18em;
    }
    .footer {
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 8;
      width: 100%;
      height: 176mm;
      padding: 30mm 28mm 22mm;
      display: grid;
      grid-template-columns: 1fr 106mm;
      gap: 24mm;
      align-items: end;
      color: #f3efe4;
      background: #0f3d27;
    }
    .name-kicker {
      margin-bottom: 8mm;
      color: #c7ff4a;
      font-size: 7mm;
      font-weight: 800;
      letter-spacing: .18em;
    }
    .name {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 37mm;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.03em;
    }
    .name-en { margin-top: 5mm; font: 800 6mm/1 Arial, sans-serif; letter-spacing: .24em; }
    .qr {
      width: 93mm;
      height: 93mm;
      display: grid;
      place-items: center;
      justify-self: end;
      color: #0f3d27;
      background: #f3efe4;
      border: 3mm solid #c7ff4a;
      font: 900 7mm/1.25 Arial, sans-serif;
      text-align: center;
    }
    .crop { position: absolute; z-index: 20; background: #111; }
    .crop.h { width: 5mm; height: .25mm; }
    .crop.v { width: .25mm; height: 5mm; }
    .tl-h { left: 0; top: 3mm; } .tl-v { left: 3mm; top: 0; }
    .tr-h { right: 0; top: 3mm; } .tr-v { right: 3mm; top: 0; }
    .bl-h { left: 0; bottom: 3mm; } .bl-v { left: 3mm; bottom: 0; }
    .br-h { right: 0; bottom: 3mm; } .br-v { right: 3mm; bottom: 0; }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="trim">
      <div class="masthead">KAMEYAMA CIVIC REPORT</div>
      <div class="edition">A1 POSTER MASTER</div>
      <h1 class="headline"><span>暮らしの声を、</span><br>市政の力に。</h1>
      <p class="lead">写真と名前を前面に出しながら、政策や活動の要点を遠くからでも一瞬で読ませるための基本版面です。</p>
      <div class="photo"></div>
      <div class="vertical-note">対話から、次の一歩へ。</div>
      <footer class="footer">
        <div>
          <div class="name-kicker">亀山市議会議員</div>
          <h2 class="name">草川たくや</h2>
          <div class="name-en">KUSAKAWA TAKUYA</div>
        </div>
        <div class="qr">QR<br>80mm以上</div>
      </footer>
    </div>
    <i class="crop h tl-h"></i><i class="crop v tl-v"></i>
    <i class="crop h tr-h"></i><i class="crop v tr-v"></i>
    <i class="crop h bl-h"></i><i class="crop v bl-v"></i>
    <i class="crop h br-h"></i><i class="crop v br-v"></i>
  </main>
</body>
</html>
