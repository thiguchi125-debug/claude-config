<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<style>
:root{--lime:#c7ff4a;--green:#1f5a3a;--deep:#0f3d27;--kinari:#f3efe4;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
body{width:100vw;height:100vh;overflow:hidden;position:relative;
 background:radial-gradient(130% 100% at 50% 12%, #24694a 0%, #0f3d27 55%, #08281a 100%);
 font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;}
/* 幾何アクセント: 右上のライム斜線 */
.accent{position:absolute;top:0;right:0;width:340px;height:340px;overflow:hidden;}
.accent::before{content:"";position:absolute;top:-190px;right:-190px;width:380px;height:380px;
 background:var(--lime);transform:rotate(45deg);opacity:.9;}
/* ヘッダー */
.head{position:absolute;top:132px;left:80px;right:80px;}
.kicker{color:var(--lime);font-size:30px;font-weight:700;letter-spacing:.22em;margin-bottom:22px;}
.slogan{color:#fff;font-size:104px;font-weight:800;letter-spacing:.02em;line-height:1.08;}
/* フォトカード */
.card{position:absolute;top:452px;left:50%;transform:translateX(-50%);
 width:760px;height:1000px;border-radius:30px;overflow:hidden;
 border:7px solid rgba(199,255,74,.95);
 box-shadow:0 34px 80px rgba(0,0,0,.55);background:#fff;}
.card img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
/* 下部の名前（カード直下） */
.who{position:absolute;left:0;right:0;top:1512px;text-align:center;}
.name{color:#fff;font-size:64px;font-weight:800;letter-spacing:.06em;}
.tag{color:var(--lime);font-size:36px;font-weight:700;margin-top:22px;letter-spacing:.05em;}
</style></head><body>
<div class="accent"></div>
<div class="head">
 <div class="kicker">亀山市議会議員</div>
 <div class="slogan">{{SLOGAN}}</div>
</div>
<div class="card"><img src="{{PORTRAIT}}"></div>
<div class="who">
 <div class="name">草川たくや</div>
 <div class="tag">{{TAG}}</div>
</div>
</body></html>
