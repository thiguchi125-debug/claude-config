# ===========================================
# 監視除外（ノイズ源）
# ===========================================
# 以下は意図的に除外。スキャン対象としない。
exclude:
  - 一般ニュースサイト（Yahoo!ニュース、ニュースサイトのRSS等）
  - 業界団体PR・プレスリリースのみのサイト
  - 大都市（東京23区・大阪市・名古屋市等）の局所的取り組み
  - 政治パフォーマンス報道
  - 既に決着済の議論・廃止済の制度

